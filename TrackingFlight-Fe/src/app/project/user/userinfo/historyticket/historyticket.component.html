<div class="space-y-8">
  <h1 class="text-2xl font-bold tracking-tight">Lịch Sử Mua Vé</h1>
  <div *ngIf="ticketHistory && ticketHistory.length > 0; else noHistory" class="grid grid-cols-1 gap-6">
    <app-ticket-card *ngFor="let ticket of ticketHistory" [ticket]="ticket"></app-ticket-card>
  </div>
  <ng-template #noHistory>
    <div nz-empty nzNotFoundImage="simple" class="flex flex-col items-center justify-center text-center py-12 border border-dashed rounded-lg bg-white">
      <i nz-icon nzType="file-search" class="text-5xl text-gray-400 mb-4"></i>
      <h2 class="text-xl font-semibold">Lịch sử trống</h2>
      <p class="text-gray-500">Bạn chưa có giao dịch mua vé nào trong quá khứ.</p>
    </div>
  </ng-template>
</div>
