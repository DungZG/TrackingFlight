<div class="space-y-8">
  <h1 class="text-2xl font-bold tracking-tight">Danh Sách Vé Mua</h1>
  <div *ngIf="purchasedTickets && purchasedTickets.length > 0; else noTickets" class="grid grid-cols-1 gap-6">
    <app-ticket-card *ngFor="let ticket of purchasedTickets" [ticket]="ticket"></app-ticket-card>
  </div>
  <ng-template #noTickets>
    <div nz-empty nzNotFoundImage="simple" class="flex flex-col items-center justify-center text-center py-12 border border-dashed rounded-lg bg-white">
      <i nz-icon nzType="inbox" class="text-5xl text-gray-400 mb-4"></i>
      <h2 class="text-xl font-semibold">Không có vé nào</h2>
      <p class="text-gray-500">Hiện tại bạn chưa có vé nào đang hoạt động hoặc sắp diễn ra.</p>
    </div>
  </ng-template>
</div>
